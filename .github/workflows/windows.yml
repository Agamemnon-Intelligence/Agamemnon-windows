name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the MSI and setup .exe to this release (e.g. v1.0.0). Leave empty to only build it.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  design-tokens:
    name: Design tokens are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 design/generate_tokens.py --check

  yara-rules:
    name: YARA rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yara-python
      - run: python windows/rules/test_rules.py

  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - run: dotnet build windows/Agamemnon.Windows.slnx -c Release
      - run: dotnet test windows/tests/Agamemnon.Core.Tests -c Release --no-build

  package:
    name: Signed MSI and setup .exe
    needs: [design-tokens, yara-rules, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write # upload the installers to the GitHub Release
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      # Secrets can't be tested in `if:` directly; expose them to the job instead.
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - name: Restore code-signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'agamemnon-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "AGAMEMNON_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build MSI and setup .exe
        shell: pwsh
        env:
          AGAMEMNON_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { '0.0.${{ github.run_number }}' }
          ./windows/build/package.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: agamemnon-windows-installer
          path: |
            windows/artifacts/*.msi
            windows/artifacts/*-Setup.exe
      - name: Attach the MSI and setup .exe to the GitHub Release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem windows/artifacts/*.msi, windows/artifacts/*-Setup.exe | ForEach-Object FullName
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $env:RELEASE_TAG --generate-notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'creating the release failed' }
          }
          gh release upload $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'uploading the installers failed' }
