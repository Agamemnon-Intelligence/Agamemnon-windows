name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-tokens:
    name: Design tokens are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 design/generate_tokens.py --check

  yara-rules:
    name: YARA rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yara-python
      - run: python windows/rules/test_rules.py

  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - run: dotnet build windows/Agamemnon.Windows.slnx -c Release
      - run: dotnet test windows/tests/Agamemnon.Core.Tests -c Release --no-build

  package:
    name: Signed MSI
    needs: [design-tokens, yara-rules, build-and-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # Secrets can't be tested in `if:` directly; expose them to the job instead.
      SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - name: Restore code-signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'agamemnon-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "AGAMEMNON_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build MSI
        shell: pwsh
        env:
          AGAMEMNON_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.0.${{ github.run_number }}' }
          ./windows/build/package.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: agamemnon-windows-msi
          path: windows/artifacts/*.msi
